# Finance Tracker's account console (the finance repository's UX-15, D-619): keycloak.v3 of Keycloak 26.7.4
# (PatternFly 5), with no template copied. Its own styles and scripts stay; css/tokens.css (the app's tokens and fonts)
# and css/account.css come after them, and js/theme.js, which index.ftl loads as a module, sets data-theme.
parent=keycloak.v3
styles=css/tokens.css css/account.css
scripts=js/theme.js
# Only the app's three themes (D-616), never keycloak.v3's own dark mode.
darkMode=false
