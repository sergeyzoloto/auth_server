# Finance Tracker's sign-in pages (the finance repository's UX-15, D-613 to D-618): keycloak.v2 of Keycloak 26.7.4
# (PatternFly 5), with no template copied. The look is CSS (css/tokens.css, the app's tokens and fonts, then
# css/login.css), after keycloak.v2's own styles, which stay; js/theme.js sets data-theme before the first paint.
parent=keycloak.v2
styles=css/styles.css css/tokens.css css/login.css
scripts=js/theme.js
# Only the app's three themes (D-616), never keycloak.v2's own dark mode.
darkMode=false
