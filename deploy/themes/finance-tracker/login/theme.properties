# Finance Tracker's sign-in pages (the finance repository's UX-15, D-613 to D-618): keycloak.v2 (PatternFly 5, Keycloak
# 26.8.2 since OPS-4; 26.7.4 before) with no template copied. The look is CSS: css/tokens.css (the app's tokens and
# fonts), then css/login-3.css, after keycloak.v2's own styles, which stay; js/theme.js sets data-theme before the first
# paint. The CSS file is renamed whenever it changes (login.css, login-2.css in the finance repository's UX-19,
# login-3.css in OPS-4 for 26.8.2's social buttons), so that no browser keeps an old copy: the resource paths carry a
# version that a restart doesn't change (it changed with 26.8.2, but a rename doesn't depend on that).
parent=keycloak.v2
styles=css/styles.css css/tokens.css css/login-3.css
scripts=js/theme.js
# Only the app's three themes (D-616), never keycloak.v2's own dark mode.
darkMode=false
