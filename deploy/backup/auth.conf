# Backup instance "auth": the Keycloak database. Installed on the server as
# /etc/pg-backup/auth.conf by deploy/backup/install.sh; read by pg-backup and
# pg-restore-test. Another database gets its own INSTANCE.conf in the same format.
# Format: KEY=value, one per line; the value is everything after the first "=",
# taken literally (no quotes, no variables). No secrets belong here.

# Compose project directory and the service that runs Postgres
COMPOSE_DIR=/opt/auth
SERVICE=postgres

# Database and user, as in deploy/docker-compose.yml (POSTGRES_DB, POSTGRES_USER)
DB_NAME=keycloak
DB_USER=keycloak

# Dumps go to BACKUP_DIR; the laptop pulls everything under /var/backups/pg/
BACKUP_DIR=/var/backups/pg/auth
RETENTION_DAYS=14

# Restore test (pg-restore-test): each CHECK_NAME query runs read-only against
# production and against the restored copy, and the results must match. The
# number of tables is always compared.
CHECK_REALMS=SELECT count(*) FROM realm
CHECK_MYAPPS_USERS=SELECT count(*) FROM user_entity WHERE realm_id = (SELECT id FROM realm WHERE name = 'myapps') AND service_account_client_link IS NULL
CHECK_MYAPPS_CLIENTS=SELECT count(*) FROM client WHERE realm_id = (SELECT id FROM realm WHERE name = 'myapps')
