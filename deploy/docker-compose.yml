# Production-вариант стека: Keycloak + Postgres + Caddy (автоматический HTTPS).
# Наружу открыты ТОЛЬКО порты 80/443 (Caddy). Postgres и Keycloak доступны
# лишь внутри docker-сети; health-порт 9000 — только с самого сервера.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports: намеренно НЕТ — БД не должна быть видна из интернета

  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:?set KC_VERSION in .env}
    command: start --import-realm          # prod-режим вместо start-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${KC_DOMAIN:?set KC_DOMAIN in .env}   # публичный URL целиком
      KC_HTTP_ENABLED: "true"            # TLS снимает Caddy, до Keycloak идёт HTTP внутри сети
      KC_PROXY_HEADERS: xforwarded       # доверять X-Forwarded-* от Caddy
      KC_HEALTH_ENABLED: "true"          # /health/* на порту 9000
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?set KC_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:9000:9000"            # health-check только с localhost сервера

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - keycloak
    environment:
      KC_DOMAIN: ${KC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                 # здесь хранятся TLS-сертификаты — не удалять
      - caddy_config:/config

volumes:
  keycloak_pg_data:
  caddy_data:
  caddy_config:
