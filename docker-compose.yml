services:
  postgres:
    image: postgres:16
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Production's image, tag and digest (deploy/docker-compose.yml), so that the theme is checked on the same base
    # (UX-15 of the finance repository, D-615).
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    container_name: keycloak
    restart: unless-stopped
    # start-dev turns the theme cache off: a change under deploy/themes shows at the next page load.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # The theme production mounts (deploy/docker-compose.yml).
      - ./deploy/themes/finance-tracker:/opt/keycloak/themes/finance-tracker:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Dev only: catches every email the dev realm sends (its SMTP is mailpit:1025; README, "Dev realm: the theme and
  # email"). Read them at http://127.0.0.1:8025. Nothing like it is in deploy/.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web interface and API
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  keycloak_pg_data:
